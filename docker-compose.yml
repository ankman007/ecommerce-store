services:
  web:
    build: .
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python core/create_admin.py &&
        gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload"
    ports:
      - "${WEB_PORT:-8085}:8000"
    volumes:
      - .:/app
      # Keep the static files collected at build time instead of the host's (empty) folder
      - /app/staticfiles
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery:
    build: .
    command: celery -A core worker --loglevel=info --pool=solo
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build: .
    command: celery -A core flower --port=5555
    ports:
      - "${FLOWER_PORT:-5560}:5555"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Kathmandu
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 forces TCP, so the check only passes once the real server
      # (not the temporary init server) is accepting connections
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
