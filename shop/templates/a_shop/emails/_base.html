<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>{% block subject %}{% endblock %}</title></head>
<body style="margin: 0; padding: 24px; background: #f3f4f6; font-family: Arial, Helvetica, sans-serif; color: #111827;">
  <div style="max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 24px;">
    <p style="margin: 0 0 16px; font-size: 18px; font-weight: bold; color: #1f2937;">A One Albany Wholesale</p>
    {% block body %}{% endblock %}
    <p style="margin: 24px 0 0;">
      <a href="{{ order_url }}" style="display: inline-block; background: #4f46e5; color: #ffffff; padding: 10px 18px; border-radius: 6px; text-decoration: none;">View your order</a>
    </p>
    <p style="margin: 24px 0 0; font-size: 12px; color: #6b7280;">
      Questions? Reply to this email or contact us at <a href="{{ site_url }}/contact/" style="color: #4f46e5;">{{ site_url }}/contact/</a> and mention order #{{ order.id }}.
    </p>
  </div>
</body>
</html>
