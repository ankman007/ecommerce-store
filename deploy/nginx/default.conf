# Reverse proxy for the Django app (gunicorn on web:8000).
# Plain HTTP on port 80. TLS is terminated in front of this container (host nginx + certbot,
# Caddy, a cloud load balancer, Cloudflare, ...) -- see docs/DEPLOYMENT.md.

# Docker's embedded DNS. Re-resolving "web" means a recreated web container (new IP) is
# picked up without restarting nginx, and nginx can start before web resolves.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream django {
    zone django 64k;
    server web:8000 resolve;
    keepalive 16;
}

# Keep the scheme the TLS terminator saw; fall back to our own when the request came straight in.
# Django trusts this header (SECURE_PROXY_SSL_HEADER). If this nginx is ever the public edge,
# replace this map with a plain `$scheme` so clients can't claim https over http.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    # Uploads (product images, avatars). Keep >= Django's FILE_UPLOAD/DATA_UPLOAD limits.
    client_max_body_size 10m;
    client_body_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;

    # Django sets X-Frame-Options, nosniff, Referrer-Policy, COOP and HSTS on its own responses.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # User-uploaded files, served straight from the shared media volume.
    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
        # Uploaded files are untrusted: never let one run as a page on our origin.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Static files are served by WhiteNoise in the app; nginx only adds compression.
    location /static/ {
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.inc;
        access_log off;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://django;
        include /etc/nginx/conf.d/proxy_params.inc;
    }
}
