# Lint + format config shared by pre-commit, CI and editors.
target-version = "py313"
line-length = 120
extend-exclude = ["*/migrations/*"]

[lint]
# Ruff defaults (pyflakes + core pycodestyle errors). Widen gradually.
select = ["E4", "E7", "E9", "F"]

[format]
# The codebase mixes quote styles; keep whatever each line uses.
quote-style = "preserve"
