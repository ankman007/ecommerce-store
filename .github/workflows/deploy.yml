name: Deploy

# Manual only: Actions > Deploy > Run workflow. See docs/DEPLOYMENT.md.
#  - image_tag empty: lint + test the selected ref, build and push both images, deploy them.
#  - image_tag set (e.g. sha-<old commit>): skip the build and redeploy that tag (rollback).
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy instead of building (rollback), e.g. sha-0123abc..."
        required: false
        default: ""

permissions:
  contents: read

# Never run two deploys at once; a queued one waits instead of cancelling a deploy mid-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Lint and test
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: core.test_settings
    steps:
      - uses: actions/checkout@v7

      - name: Install MySQL client headers (needed to build mysqlclient)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --parallel auto

  build:
    name: Build and push images
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Image names
        id: vars
        run: |
          # GHCR repository names must be lowercase
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "app=${REGISTRY}/${repo}"
            echo "nginx=${REGISTRY}/${repo}-nginx"
            echo "tag=sha-${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.app }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.app }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push nginx image
        uses: docker/build-push-action@v7
        with:
          context: deploy/nginx
          push: true
          tags: |
            ${{ steps.vars.outputs.nginx }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.nginx }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  deploy:
    name: Deploy to production
    needs: [checks, build]
    # Run after a successful build, or straight away for a rollback (checks/build skipped).
    if: >-
      always() &&
      (inputs.image_tag != '' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    # Configure required reviewers for this environment in Settings > Environments.
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build.outputs.tag }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/ecommerce-store' }}
    steps:
      - name: Validate image tag
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] \
            || { echo "::error::Invalid image tag"; exit 1; }

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The compose file must match the images, so on a rollback to sha-<commit> use that commit's copy.
      - name: Use the compose file from the deployed commit
        if: startsWith(inputs.image_tag, 'sha-')
        run: git checkout --detach "${IMAGE_TAG#sha-}"

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Set the DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS secrets"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (from `ssh-keyscan <host>` checked out of band), never trust-on-first-use.
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            Port ${{ vars.DEPLOY_PORT || '22' }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy compose file
        run: |
          ssh deploy-target "test -f $(printf '%q' "$DEPLOY_PATH")/.env.prod" \
            || { echo "::error::.env.prod is missing in DEPLOY_PATH on the server (see docs/DEPLOYMENT.md)"; exit 1; }
          scp docker-compose.prod.yml "deploy-target:${DEPLOY_PATH}/docker-compose.prod.yml"

      - name: Pull, migrate and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          app_image="${REGISTRY}/${repo}:${IMAGE_TAG}"
          nginx_image="${REGISTRY}/${repo}-nginx:${IMAGE_TAG}"
          echo "Deploying ${app_image}"
          # The token is only valid while this job runs; it is used once to pull, then logged out.
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target \
            "docker login ${REGISTRY} -u '${{ github.actor }}' --password-stdin"
          ssh deploy-target "bash -s -- $(printf '%q ' "$DEPLOY_PATH" "$app_image" "$nginx_image")" <<'EOF'
          set -euo pipefail
          cd "$1"
          export APP_IMAGE="$2" NGINX_IMAGE="$3"
          trap 'docker logout ghcr.io >/dev/null' EXIT
          dc() { docker compose --env-file .env.prod -f docker-compose.prod.yml "$@"; }
          dc pull --quiet
          dc run --rm migrate
          dc up -d --remove-orphans --wait --wait-timeout 300
          # Remember what is live, for rollbacks and for manual compose commands on the server.
          printf 'APP_IMAGE=%s\nNGINX_IMAGE=%s\n' "$APP_IMAGE" "$NGINX_IMAGE" > .deployed-images
          printf '%s %s\n' "$(date -u +%FT%TZ)" "$APP_IMAGE" >> .deploy-history
          dc ps
          docker image prune -f >/dev/null
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
